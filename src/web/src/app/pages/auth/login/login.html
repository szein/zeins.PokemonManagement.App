<div class="auth-layout">

  <section class="hero-panel">
    <div class="hero-content">

      <div class="brand">
        <span class="logo">PKN</span>
      </div>

      <h1>Manage your Pokmons</h1>

      <p>
        Track you Favoriate Pokemons
      </p>
     

    </div>
  </section>

  <section class="login-panel">

    <mat-card class="login-card">

      <h2>Welcome !</h2>

      <p class="subtitle">
        Sign in to access your Collection
      </p>

      <button
        mat-raised-button
        color="primary"
        class="login-button"
        type="submit"
        (click)="login()">

        Sign In

      </button>

    </mat-card>

  </section>

</div>
