<mat-card elevated>
  <mat-card-header>
    <mat-card-title-group>
      <mat-card-title>{{pokemonItem.name}}</mat-card-title>
      <!-- <mat-card-subtitle>Small</mat-card-subtitle> -->
      <img mat-card-sm-image src="pokemon-ball-img.png" >
    </mat-card-title-group>
  </mat-card-header>
  <mat-card-content>
    <p>Height: {{ pokemonItem.height }}</p>
    <p>Weight: {{ pokemonItem.weight }}</p>
  </mat-card-content>
  <mat-card-actions class="card-actions">
    
    <button 
    matButton="elevated"
    [class.owned]="owned"
    [class.not-owned]="!owned"
    (click)="onActionButtonClick()">
      {{actionButtonText}}
    </button>
    
    <button matIconButton aria-label="call pokemon api">
        <mat-icon>open_in_new</mat-icon>
      </button>
  </mat-card-actions>
</mat-card>
